name: 问题咨询与支持 (Support)
description: 提交有关 ZTool 的使用疑问与咨询 / Submit questions and support requests for ZTool
title: "[SUPPORT] <简短描述您的问题 / Short description of the issue>"
labels: ["Question/有待商榷"]
body:
  - type: markdown
    attributes:
      value: |
        ### 自查声明与指南 / Self-Check Declaration & Guides
        在提交问题咨询之前，请确保您已经查阅了以下内容，许多常见的使用困惑都可以立刻得到解答：
        Before submitting a question, please ensure you have checked the following, where most common issues are already addressed:

        1. [README](https://github.com/qwqawa64/ZUX-ZTool/blob/master/README.md)
        2. 应用内各设置项的说明文字与使用帮助 / Descriptions and help text of each setting in the app
        3. [Issue 列表 / Issue List](https://github.com/qwqawa64/ZUX-ZTool/issues)
        4. [Releases 说明 / Release Notes](https://github.com/qwqawa64/ZUX-ZTool/releases)

        注意：模块仅在 LSPosed 中正确勾选作用域并重启对应应用后才会生效，请先确认这一点。
        Note: The module only takes effect after the correct scope is enabled in LSPosed and the target app is restarted. Please confirm this first.
  - type: input
    id: system_version
    attributes:
      label: 系统版本与设备型号 / System Version and Device Model
      description: |
        例如：ZUXOS 1.5.04.366 / 联想小新平板 Pro GT (TB710FU)。
        Example: ZUXOS 1.5.04.366 / Lenovo Yoga Tab (TB710FU).
    validations:
      required: true
  - type: input
    id: ztool_version
    attributes:
      label: ZTool 版本 / ZTool Version
    validations:
      required: true
  - type: textarea
    id: question_description
    attributes:
      label: 问题详细描述 / Detailed Description of the Issue
      description: |
        请说明您的目标、已经尝试过的操作与当前结果。
        Describe your goal, what you have already tried, and the current result.
    validations:
      required: true
  - type: textarea
    id: additional_info
    attributes:
      label: 其它补充信息 / 运行截图 / Other Additional Info / Screenshots
      placeholder: 拖拽图片或补充说明... (Drag & drop images or add descriptions...)

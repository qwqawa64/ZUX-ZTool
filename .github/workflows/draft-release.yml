name: Draft a Release

on:
  workflow_dispatch:              # 手动触发

permissions:
  contents: write                 # 打标签 + 创建草稿 Release

jobs:
  build:
    name: Build Debug & Release
    # 复用 Android CI 工作流：workflow_call 事件下其内部逻辑等价于手动触发，总是构建
    uses: ./.github/workflows/android.yml

  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ---- 生成标签名 yyyyMMdd-ZTool_Beta ----
      - name: Compute release tag
        id: tag
        run: echo "name=$(date +%Y%m%d)-ZTool_Beta" >> $GITHUB_OUTPUT

      # ---- 下载构建工作流产出的签名 Release APK 工件 ----
      - name: Download release APK artifact
        uses: actions/download-artifact@v7
        with:
          pattern: ZTool-release-signed-apk-*
          merge-multiple: true
          path: release-apk

      - name: Extract app-release.apk
        id: apk
        run: |
          set -euo pipefail
          apk=$(find release-apk -name '*.apk' -not -name '*unsigned*' | head -n 1)
          test -n "$apk"
          echo "path=$apk" >> $GITHUB_OUTPUT
          echo "Found release APK: $apk"

      # ---- 提取 更新日志.txt 最新一批（文件开头到第一个 "Beta/ 版本头之间）----
      - name: Extract latest changelog batch
        run: |
          set -euo pipefail
          # 取从文件开头到第一个版本标记行（"Beta/…）之前的内容；没有标记则全文
          if grep -q '^"Beta/' 更新日志.txt; then
            awk '/^"Beta\//{exit} {print}' 更新日志.txt > latest-changelog.md
          else
            cp 更新日志.txt latest-changelog.md
          fi
          # 去掉尾部空行，避免正文出现多余空隙
          printf '%s\n' "$(cat latest-changelog.md)" > latest-changelog.md

      # ---- 打标签并创建草稿 Release（标签不存在时自动在当前提交上创建） ----
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          draft: true
          prerelease: false
          body_path: latest-changelog.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

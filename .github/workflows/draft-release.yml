name: Draft a Release

on:
  workflow_dispatch:              # 手动触发

permissions:
  contents: write                 # 打标签 + 创建草稿 Release

jobs:
  build:
    name: Build Debug & Release
    # 复用 Android CI 工作流：workflow_call 事件下其内部逻辑等价于手动触发，总是构建
    # secrets: inherit —— secrets 不会自动透传给可复用工作流，签名密钥必须显式继承
    uses: ./.github/workflows/android.yml
    secrets: inherit

  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ---- 生成标签名 yyyyMMdd-ZTool_Beta ----
      - name: Compute release tag
        id: tag
        run: echo "name=$(date +%Y%m%d)-ZTool_Beta" >> $GITHUB_OUTPUT

      # ---- 下载构建工作流产出的签名 Release APK 工件 ----
      - name: Download release APK artifact
        uses: actions/download-artifact@v7
        with:
          pattern: ZTool-release-signed-apk-*
          merge-multiple: true
          path: release-apk

      - name: Extract app-release.apk
        id: apk
        run: |
          set -euo pipefail
          apk=$(find release-apk -name '*.apk' -not -name '*unsigned*' | head -n 1)
          test -n "$apk"
          echo "path=$apk" >> $GITHUB_OUTPUT
          echo "Found release APK: $apk"

      # ---- 提取 更新日志.txt 最新一批（首行版本头 + 其后条目，到下一个版本头为止）----
      - name: Extract latest changelog batch
        run: |
          set -euo pipefail
          # 第一行是当前版本 header（"Beta/…），取到下一个版本标记行之前；没有则全文
          awk 'NR>1 && /^"Beta\//{exit} {print}' 更新日志.txt > latest-changelog.md
          # 去掉尾部空行，避免正文出现多余空隙
          printf '%s\n' "$(cat latest-changelog.md)" > latest-changelog.md
          # 条目正文（不含 header），供 UpdateCheck.json 的 whatNew 使用
          tail -n +2 latest-changelog.md > latest-entries.txt

      # ---- 解析 header 并填充 UpdateCheck.json ----
      - name: Update UpdateCheck.json
        run: |
          set -euo pipefail
          header=$(head -n1 latest-changelog.md)
          version_name=$(printf '%s' "$header" | sed -E 's/^"([^"]+)".*/\1/')
          version_code=$(printf '%s' "$header" | grep -oE '\(c[0-9]+\)' | grep -oE '[0-9]+')
          # url = 本次 release 标签的完整 URL（标签日期为 8 位 yyyyMMdd）
          url="https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.name }}"
          test -n "$version_name" && test -n "$version_code"
          echo "version=$version_name code=$version_code url=$url"
          jq -n \
            --arg name "$version_name" \
            --argjson code "$version_code" \
            --rawfile entries latest-entries.txt \
            --arg url "$url" \
            '{newVersionName: $name,
              newVersionCode: $code,
              whatNew: ($entries | gsub("\n+$"; "")),
              url: $url}' > UpdateCheck.json
          cat UpdateCheck.json

      # ---- 打标签并创建草稿 Release（标签不存在时自动在当前提交上创建） ----
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          draft: true
          prerelease: false
          body_path: latest-changelog.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      # ---- 将更新后的 UpdateCheck.json 推送到远程 ----
      - name: Commit and push UpdateCheck.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UpdateCheck.json
          git commit -m "updatecheck: release ${{ steps.tag.outputs.name }}"
          git push origin HEAD:${{ github.ref_name }}

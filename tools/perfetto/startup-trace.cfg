# Perfetto trace config for ZTool cold-start measurement.
#
# Usage (device must be connected and unlocked):
#   adb push tools/perfetto/startup-trace.cfg /data/local/tmp/startup-trace.cfg
#   adb shell rm -f /data/misc/perfetto-traces/ztool-startup.perfetto-trace
#   adb shell perfetto -c /data/local/tmp/startup-trace.cfg --txt \
#       -o /data/misc/perfetto-traces/ztool-startup.perfetto-trace -d
#   # ... force-stop + launch the app the number of times you want ...
#   adb pull /data/misc/perfetto-traces/ztool-startup.perfetto-trace
#
# The trace stops on its own after duration_ms. atrace categories below are the
# ones this device actually advertises (`adb shell atrace --list_categories`);
# unknown categories make perfetto refuse to start the data source.

buffers {
  size_kb: 65536
  fill_policy: RING_BUFFER
}
buffers {
  size_kb: 8192
  fill_policy: RING_BUFFER
}

data_sources {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      # am  -> "launching: <package>", activityStart/activityResume; this is what
      #        the android_startups table in trace processor is built from
      # wm  -> window/task transitions, the system splash screen window
      # gfx -> Choreographer#doFrame / DrawFrame, i.e. the first-frame signal
      # res -> resource loading (theme, drawables)
      # pm  -> PackageManager: our alias writes and getComponentEnabledSetting
      #       calls show up here, which is how you see the startup maintenance
      # binder_driver -> binder transactions, including the LSPosed service
      atrace_categories: "am"
      atrace_categories: "wm"
      atrace_categories: "gfx"
      atrace_categories: "view"
      atrace_categories: "input"
      atrace_categories: "res"
      atrace_categories: "pm"
      atrace_categories: "dalvik"
      atrace_categories: "binder_driver"
      # sched/freq/idle together give sched_switch, so a main thread blocked on
      # su / root round trips shows up as sleeping rather than running
      atrace_categories: "sched"
      atrace_categories: "freq"
      atrace_categories: "idle"
      # Only matters if the app adds Trace.beginSection(); harmless otherwise.
      atrace_apps: "com.qimian233.ztool"
      buffer_size_kb: 65536
      drain_period_ms: 250
    }
  }
}

# Gives the process/thread naming and the process_start marker, so the trace
# shows exactly when the fork happened relative to the first frame.
data_sources {
  config {
    name: "linux.process_stats"
    target_buffer: 1
    process_stats_config {
      scan_all_processes_on_start: true
    }
  }
}

# Per-frame SurfaceFlinger FrameTimeline entries (expected/actual present + GPU
# timestamps). This is the data source that lets you measure what the eye sees —
# including how long the app's own reveal animation kept producing frames — rather
# than only the first drawn frame.
data_sources {
  config {
    name: "android.surfaceflinger.frametimeline"
    target_buffer: 1
  }
}

# Required for perfetto to resolve the package for atrace_apps and for the
# android_startups table to attribute a launch to com.qimian233.ztool.
data_sources {
  config {
    name: "android.packages_list"
    target_buffer: 1
  }
}

# The app logs a lot through android.util.Log; having it inline makes the trace
# self-explanatory (LogCollectorService, HomeRepository, EnhancedShellExecutor).
data_sources {
  config {
    name: "android.log"
    target_buffer: 1
    android_log_config {
      log_ids: LID_DEFAULT
      log_ids: LID_SYSTEM
      log_ids: LID_CRASH
    }
  }
}

# Long enough for force-stop + launch x3.
duration_ms: 60000
flush_period_ms: 1000

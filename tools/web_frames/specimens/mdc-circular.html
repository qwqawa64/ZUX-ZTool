<!---- Material Components circular progress, indeterminate.
      Markup follows the MDC docs; the arc geometry comes from stroke-dasharray = full
      circumference (2*pi*18 = 113.097) with stroke-dashoffset = half of it, so each
      clipper holds a semi-circle and the ±265 -> ±130 spin clips it into a breathing arc. ---->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@material/circular-progress@14.0.0/dist/mdc.circular-progress.css">
<style>
  body { margin: 24px; background: #fff; }
  .mdc-circular-progress__indeterminate-circle-graphic { stroke: #1979ff; }
  /* The real component fades four colour layers in turn. The module draws a single
     colour, so the fade is dropped here to keep every sampled frame visible. */
  .mdc-circular-progress__color-1 {
    animation: mdc-circular-progress-spinner-layer-rotate 5332ms cubic-bezier(0.4, 0, 0.2, 1) infinite both;
  }
</style>
</head>
<body>
  <div class="mdc-circular-progress mdc-circular-progress--indeterminate" role="progressbar"
       aria-label="loading" aria-valuemin="0" aria-valuemax="1"
       style="width:120px;height:120px;">
    <div class="mdc-circular-progress__determinate-container">
      <svg class="mdc-circular-progress__determinate-circle-graphic" viewBox="0 0 48 48">
        <circle class="mdc-circular-progress__determinate-track" cx="24" cy="24" r="18" stroke-width="4"></circle>
        <circle class="mdc-circular-progress__determinate-circle" cx="24" cy="24" r="18" stroke-width="4"
                stroke-dasharray="113.097" stroke-dashoffset="113.097"></circle>
      </svg>
    </div>
    <div class="mdc-circular-progress__indeterminate-container">
      <div class="mdc-circular-progress__spinner-layer mdc-circular-progress__color-1">
        <div class="mdc-circular-progress__circle-clipper mdc-circular-progress__circle-left">
          <svg class="mdc-circular-progress__indeterminate-circle-graphic" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="18" stroke-width="4"
                    stroke-dasharray="113.097" stroke-dashoffset="56.549"></circle>
          </svg>
        </div>
        <div class="mdc-circular-progress__gap-patch">
          <svg class="mdc-circular-progress__indeterminate-circle-graphic" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="18" stroke-width="4"
                    stroke-dasharray="113.097" stroke-dashoffset="56.549"></circle>
          </svg>
        </div>
        <div class="mdc-circular-progress__circle-clipper mdc-circular-progress__circle-right">
          <svg class="mdc-circular-progress__indeterminate-circle-graphic" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="18" stroke-width="4"
                    stroke-dasharray="113.097" stroke-dashoffset="56.549"></circle>
          </svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
